openapi: 3.0.3
info:
  title: STC Config and Watch Example
  version: 1.0.0
paths:
  /tasks:
    get:
      tags:
        - task
      summary: List tasks
      operationId: listTasks
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags:
        - task
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskInput"
      responses:
        "200":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    patch:
      tags:
        - task
      summary: Update a task
      operationId: updateTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      tags:
        - task
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTaskResponse"
components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        completed:
          type: boolean
    UpdateTaskInput:
      type: object
      properties:
        title:
          type: string
        completed:
          type: boolean
    CreateTaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
    DeleteTaskResponse:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
